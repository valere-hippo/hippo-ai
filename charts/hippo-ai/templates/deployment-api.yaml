apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hippo-ai.fullname" . }}-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "hippo-ai.name" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "hippo-ai.name" . }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          resources: {{ toYaml .Values.resources | nindent 10 }}
          env:
            - name: DATABASE_URL
              value: "postgresql://..."
            - name: REDIS_URL
              value: "redis://..."
      nodeSelector: {{ toYaml .Values.gpu.nodeSelector | nindent 6 }}
      tolerations: []
      restartPolicy: Always
