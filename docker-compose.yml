services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      HIPPO_AI_DATA_ROOT: /data
      HIPPO_AI_QDRANT_URL: http://qdrant:6333
    volumes:
      - ./workspace:/data
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
