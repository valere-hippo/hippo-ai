<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">HIPPO AI Arbeitsfluss</title>
  <desc id="desc">Ein fließendes Diagramm zeigt den Weg von Anfrage über Kontext, Tools und PC-Agent zum Ergebnis.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#55d0ba"/>
      <stop offset="100%" stop-color="#6ca8ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ca8ff"/>
      <stop offset="100%" stop-color="#a86dff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="32" fill="#07111a"/>
  <g opacity="0.12">
    <circle cx="160" cy="108" r="108" fill="#55d0ba"/>
    <circle cx="1032" cy="284" r="126" fill="#6ca8ff"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#ecf5ff">
    <rect x="46" y="138" width="170" height="122" rx="24" fill="#0e1b29" stroke="white" stroke-opacity="0.09"/>
    <text x="131" y="186" text-anchor="middle" font-size="26" font-weight="700">Anfrage</text>
    <text x="131" y="216" text-anchor="middle" font-size="15" fill="#aab8c8">Text · Sprache · Ziel</text>

    <rect x="276" y="104" width="186" height="190" rx="26" fill="#0e1b29" stroke="url(#g1)" stroke-width="2"/>
    <text x="369" y="171" text-anchor="middle" font-size="26" font-weight="700">Kontext</text>
    <text x="369" y="201" text-anchor="middle" font-size="15" fill="#aab8c8">Projekt · Dateien</text>
    <text x="369" y="226" text-anchor="middle" font-size="15" fill="#aab8c8">Skills · Tools</text>

    <rect x="514" y="138" width="172" height="122" rx="24" fill="#0e1b29" stroke="white" stroke-opacity="0.09"/>
    <text x="600" y="186" text-anchor="middle" font-size="26" font-weight="700">Entscheidung</text>
    <text x="600" y="216" text-anchor="middle" font-size="15" fill="#aab8c8">Antwort oder Aktion</text>

    <rect x="744" y="104" width="182" height="190" rx="26" fill="#0e1b29" stroke="url(#g2)" stroke-width="2"/>
    <text x="835" y="171" text-anchor="middle" font-size="26" font-weight="700">PC-Agent</text>
    <text x="835" y="201" text-anchor="middle" font-size="15" fill="#aab8c8">Starten · Klicken</text>
    <text x="835" y="226" text-anchor="middle" font-size="15" fill="#aab8c8">Tippen · Öffnen</text>

    <rect x="984" y="138" width="170" height="122" rx="24" fill="#0e1b29" stroke="white" stroke-opacity="0.09"/>
    <text x="1069" y="186" text-anchor="middle" font-size="26" font-weight="700">Ergebnis</text>
    <text x="1069" y="216" text-anchor="middle" font-size="15" fill="#aab8c8">Bericht · Datei</text>
  </g>

  <g stroke="url(#g1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M216 199 H 270"/>
    <path d="M462 199 H 508"/>
    <path d="M686 199 H 736"/>
    <path d="M928 199 H 976"/>
  </g>

  <g fill="#55d0ba">
    <circle cx="243" cy="199" r="7"/>
    <circle cx="488" cy="199" r="7"/>
    <circle cx="713" cy="199" r="7"/>
    <circle cx="954" cy="199" r="7"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#55d0ba" font-size="12" letter-spacing="0.14em" text-transform="uppercase" opacity="0.9">
    <text x="131" y="306" text-anchor="middle">Eingabe</text>
    <text x="369" y="306" text-anchor="middle">Kontext</text>
    <text x="600" y="306" text-anchor="middle">Modell</text>
    <text x="835" y="306" text-anchor="middle">Aktion</text>
    <text x="1069" y="306" text-anchor="middle">Output</text>
  </g>
</svg>
