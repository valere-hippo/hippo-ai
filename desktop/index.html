<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hippo-ai</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div>
            <p class="eyebrow">Projekt-KI</p>
            <h1>hippo-ai</h1>
          </div>
          <span class="pill" id="sidebar-mode-pill">Allgemeiner Chat</span>
        </div>

        <section class="sidebar-section">
          <div class="section-head">
            <h2>Projekte</h2>
            <button type="button" id="refresh-projects-button" class="secondary compact">Neu laden</button>
          </div>
          <div class="project-selector">
            <label class="full">
              <span>Aktives Projekt</span>
              <select id="project-select" name="project_select"></select>
            </label>
          </div>
          <div id="project-list" class="project-list"></div>
        </section>

        <section class="sidebar-section">
          <details class="project-creator" open>
            <summary>Projekt anlegen oder Ordner anhängen</summary>
            <div id="project-form" class="sidebar-form">
              <label>
                <span>Projektname</span>
                <input id="project-name" name="project_name" placeholder="z. B. Gebietsprüfung Boesner" />
              </label>

              <label>
                <span>Beschreibung</span>
                <input id="project-description" name="project_description" placeholder="Optional" />
              </label>

              <label>
                <span>Kunde</span>
                <input id="project-client" name="project_client" placeholder="Optional" />
              </label>

              <label>
                <span>Tags</span>
                <input id="project-tags" name="project_tags" placeholder="z. B. avifauna, reptilien" />
              </label>

              <label>
                <span>Quellordner / Netzwerkpfad</span>
                <div class="input-row">
                  <input id="project-source-path" name="project_source_path" placeholder="C:\\Daten\\Projekt oder \\server\\share\\projekt" />
                  <button type="button" class="secondary compact" data-action="pick-project-folder">Wählen</button>
                </div>
              </label>

              <div class="actions">
                <button type="button" id="create-project-button">Projekt anlegen</button>
                <button type="button" id="attach-project-button" class="secondary">Ordner anhängen</button>
              </div>
            </div>
          </details>
        </section>

        <section class="sidebar-section">
          <div class="section-head">
            <h2>Projektinfo</h2>
            <button type="button" id="refresh-project-inventory-button" class="secondary compact">Scannen</button>
          </div>
          <div id="project-summary" class="project-summary">Noch kein Projekt ausgewählt.</div>
        </section>
      </aside>

      <section class="chat-panel">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Chat</p>
            <div class="chat-title-row">
              <h2 id="chat-title">Allgemeiner Chat</h2>
              <span id="status-pill" class="pill">Bereit</span>
            </div>
            <p id="chat-context" class="chat-context">Fragen ohne Projekt laufen im allgemeinen Modus.</p>
          </div>
          <button type="button" id="clear-chat-button" class="secondary">Chat leeren</button>
        </header>

        <div class="progress-wrap">
          <div class="progress-meta">
            <span id="progress-label">Bereit zum Starten</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>

        <div id="chat-thread" class="chat-thread"></div>

        <form id="chat-form" class="chat-composer">
          <label class="full">
            <span>Frage</span>
            <textarea
              id="chat-question"
              name="chat_question"
              rows="4"
              placeholder="Frage an die KI stellen, z. B. Generiere einen Bericht als Word-Datei oder analysiere das Projekt."
              required
            ></textarea>
          </label>
          <div class="actions">
            <button type="submit" id="chat-button">Senden</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
