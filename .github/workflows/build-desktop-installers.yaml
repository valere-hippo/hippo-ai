name: Build Desktop Installers

on:
  push:
    branches:
      - master
      - main
      - feature/assistant
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write runtime config
        run: node scripts/write-runtime-config.js
        env:
          HIPPO_API_URL: ${{ secrets.HIPPO_API_URL || 'https://hippo-api.hipposideros-cloud.de' }}

      - name: Build Windows installer
        run: npm run package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: hippo-ai-windows-installer
          path: desktop/dist/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write runtime config
        run: node scripts/write-runtime-config.js
        env:
          HIPPO_API_URL: ${{ secrets.HIPPO_API_URL || 'https://hippo-api.hipposideros-cloud.de' }}

      - name: Build macOS installer
        run: npm run package:mac

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: hippo-ai-macos-installer
          path: desktop/dist/*.dmg
          if-no-files-found: error
