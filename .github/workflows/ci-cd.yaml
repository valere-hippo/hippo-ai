name: CI/CD
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hippo-ai-api:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push Desktop image
        uses: docker/build-push-action@v4
        with:
          context: ./desktop
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hippo-ai-desktop:latest
          platforms: linux/amd64,linux/arm64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.0'
      - name: Install Helm
        uses: azure/setup-helm@v3
      - name: Deploy via Helm
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          helm upgrade --install hippo-ai charts/hippo-ai -f charts/hippo-ai/values.yaml \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/hippo-ai-api \
            --set image.tag=latest
