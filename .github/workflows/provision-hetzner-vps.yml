name: Provision Hetzner VPS

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Model provider to configure on the VPS"
        required: true
        type: choice
        options:
          - openai
          - claude
      api_key:
        description: "API key for the selected provider"
        required: true
        type: string
      hippo_ai_base_url:
        description: "HIPPO_AI_BASE_URL used by the backend on the VPS"
        required: false
        type: string
        default: ""
      hippo_ai_model:
        description: "HIPPO_AI_MODEL used by the backend on the VPS"
        required: false
        type: string
        default: ""
      server_name:
        description: "Hetzner server name"
        required: false
        type: string
        default: "hippo-ai-prod"
      server_type:
        description: "Hetzner server type"
        required: false
        type: string
        default: "cpx31"
      location:
        description: "Hetzner location"
        required: false
        type: string
        default: "nbg1"
      image:
        description: "Hetzner image"
        required: false
        type: string
        default: "ubuntu-24.04"

permissions:
  contents: read

concurrency:
  group: provision-hetzner-vps
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      HCLOUD_SSH_KEY_ID: ${{ vars.HCLOUD_SSH_KEY_ID }}
      HCLOUD_SSH_KEY_NAME: ${{ vars.HCLOUD_SSH_KEY_NAME }}
      HCLOUD_SERVER_TYPE: ${{ vars.HCLOUD_SERVER_TYPE }}
      HCLOUD_LOCATION: ${{ vars.HCLOUD_LOCATION }}
      HCLOUD_IMAGE: ${{ vars.HCLOUD_IMAGE }}
      HIPPO_AI_BASE_URL: ${{ vars.HIPPO_AI_BASE_URL }}
      HIPPO_AI_MODEL: ${{ vars.HIPPO_AI_MODEL }}
      PCLOUD_ACCESS_TOKEN: ${{ vars.PCLOUD_ACCESS_TOKEN }}
      INPUT_PROVIDER: ${{ inputs.provider }}
      INPUT_API_KEY: ${{ inputs.api_key }}
      INPUT_HIPPO_AI_BASE_URL: ${{ inputs.hippo_ai_base_url }}
      INPUT_HIPPO_AI_MODEL: ${{ inputs.hippo_ai_model }}
      INPUT_SERVER_NAME: ${{ inputs.server_name }}
      INPUT_SERVER_TYPE: ${{ inputs.server_type }}
      INPUT_LOCATION: ${{ inputs.location }}
      INPUT_IMAGE: ${{ inputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provision VPS on Hetzner
        run: python3 scripts/provision_hetzner_vps.py
